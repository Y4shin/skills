<!doctype html>
<html lang="en" style="color-scheme: light dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Grilling Visualizer — a live view of a question-dependency grilling session: rounds, nodes, edges, and answers."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)" />
    <title>Grilling Visualizer</title>
    <style>
      :root {
        /* Base type roles — Operate mode: a tool, not a page.
           No display voice; one system sans for UI, monospace for ids/data. */
        --p-font-ui:
          system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
        --p-font-mono:
          ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;

        /* One rem floor so the SPA's rem-based scoped styles resolve
           against a predictable base rather than the unstyled default. */
        font-family: var(--p-font-ui);
        font-size: 100%;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /* The SPA mounts into #app; give it the document flow and let the
         scoped component styles own everything inside. */
      #app {
        min-block-size: 100dvh;
      }

      /* Keep the inlined single-file output readable before the SPA hydrates:
         a quiet fallback that never fights the component's own styling. */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
