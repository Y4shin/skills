[project]
name = "prd-tool"
version = "0.1.0"
description = "Query & mutate the YAML frontmatter of a repo's docs/prd planning tree (prd-workflow plugin)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
prd-tool = "prd_tool.cli:main"
prd-tool-build = "prd_tool._build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prd_tool"]

[tool.uv]
# The interpreter comes from the Nix devshell; never let uv fetch its own.
python-downloads = "never"
