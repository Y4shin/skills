# Target-state spec for the task-workflow migration (schema_version 5)
#
# This file is the durable, machine-readable distillation of the
# enforced-workflow-v5 effort's settled architecture
# (docs/tasks/enforced-workflow-v5/arch-spec.md), verified against what the
# landed migration ACTUALLY does (the migrate-v4-to-v5 ticket; the CLI prints
# a MigrateReport whose `to` is 5).
#
# The setup-workflow skill reads this spec as its target-state source.
# Versioned with the package: corresponds to schema_version 5.
#
# Where this spec disagrees with a hop's designed steps (a deviation the
# actual run surfaced), the deviation is recorded in `deviations` as the
# truth, with a `deviation:` note. The `Q*` decision references trace to the
# original adoption grilling and are retained as provenance.

schema_version: 5
package_version: "4.0.0"
title: "Enforced workflow v5"

# ── Skill buckets ──────────────────────────────────────────────────────

buckets:
  engineering:
    promoted: true
    docs_prefix: "docs/engineering"
  productivity:
    promoted: true
    docs_prefix: "docs/productivity"
  misc:
    promoted: false
  in-progress:
    promoted: false
  deprecated:
    promoted: false

promotion_rules:
  - "Only engineering/ + productivity/ skills are promoted (shipped in
    package.json pi.skills + get a human-facing docs page)."
  - "misc/, in-progress/, deprecated/ skills are kept in the repo but NOT
    shipped (absent from pi.skills, no docs page)."
  - "Every promoted skill has an entry in package.json pi.skills and a
    docs/<bucket>/<name>.md page."
  - "A retired skill is kept in deprecated/ (content preserved, not
    deleted) with a note naming its replacement."

# ── Promoted skills (the schema-5 surface) ─────────────────────────────

promoted_skills:
  engineering:
    # Router + workflow spine
    - task-workflow-overview  # progressively disclosed explainer + tw_next fast track
    - setup-workflow          # onboard / migrate / no-op, keyed on the schema stamp
    - intake                  # the single front door; replaces triage
    - wayfinder               # the single planning-phase skill (bounded passes)
    - to-spec                 # gated on ready_for_spec; no interview
    - to-tickets              # produces architecture.md plus the ticket graph
    - implement-ticket        # the implementation phase; retires implement-task
    - finalize-effort         # effort close, review triage, archive gate
    - task-workflow-doctor    # only what the tools cannot self-diagnose
    # Discipline and vocabulary skills (unchanged in scope)
    - tdd
    - code-review
    - diagnosing-bugs
    - codebase-design
    - grilling
    - domain-modeling
    - improve-codebase-architecture
    - skill-creator
    - skill-review
    - eval-review
    # Utility skills
    - prototype
    - research
    - resolving-merge-conflicts
    - wizard
  productivity:
    - wait-what
    - handoff
    - to-questionnaire
    - teach
    - writing-for-agents
    - grill-me

# ── Deprecated skills (kept, not shipped) ──────────────────────────────

deprecated_skills:
  - create-task         # replaced by wayfinder
  - onboard-workflow    # replaced by setup-workflow
  - report-bug          # retired in favor of triage (which v5 then retires)
  - triage              # replaced by intake (the single front door)
  - implement-task      # replaced by implement-ticket
  - finalize-task       # per-ticket close-out runs inline in implement-ticket

# ── Repo-root docs ─────────────────────────────────────────────────────

repo_root_docs:
  AGENTS.md:
    purpose: "Pi-adapted agent conventions: bucket layout, promotion rules,
      invocation split, no-em-dashes, skill-tool invocation convention."
    decision: "Q2"
  CONTEXT.md:
    purpose: "This repo's workflow ubiquitous language. This repo IS the
      workflow package, so its vocabulary is the domain."
    decision: "Q2"
  docs/adr/:
    purpose: "Repo-level ADRs; an ADR is written when a living-architecture
      change is ADR-worthy under domain-modeling's rules."
    decision: "Q2"
  docs/agents/:
    purpose: "Per-repo config the skills read (seeded minimal; setup-workflow
      populates it on onboarding)."
    decision: "Q2"
  docs/bugs/:
    purpose: "Static archive only. Every bug report enters as an effort
      (subtype: bug implementation ticket), so docs/bugs/ retires as a live
      substrate, drops out of the write-guard scope, and is never moved by
      the migration."
  docs/tasks/out-of-scope/:
    purpose: "Rejected-requests KB. Its producers are wayfinder and the
      skills that defer work, through tw_record_out_of_scope."

# ── Phase flow ─────────────────────────────────────────────────────────

planning_flow:
  model: "gated phases; the opener is the gate"
  phases:
    - step: "intake"
      role: "the single front door; always creates an effort with a map and
        a non-negotiables grilling task; every bug report becomes an effort."
    - step: "wayfinder"
      role: "the single planning-phase skill; creates the map and the
        planning tasks, works bounded passes (one frontier snapshot, at most
        one grilling), writes results back, runs the reconcile pass."
    - step: "to-spec"
      role: "synthesizes the specification from the settled record; checks
        only ready_for_spec; no seam or architecture interview."
    - step: "to-tickets"
      role: "produces architecture.md alongside the ticket graph; the
        architecture is the living document."
    - step: "implement-ticket"
      role: "owns the implementation phase: the ticket frontier, per-ticket
        chain dispatch, and the inline per-ticket close-out."
    - step: "finalize-effort"
      role: "the effort close: one holistic review, finding triage,
        follow-up efforts only after a human yes, the archive gate."
  router: "task-workflow-overview (progressively disclosed explainer plus
    the tw_next fast track for the live answer)"
  user_invoked: [intake, wayfinder, to-spec, to-tickets, setup-workflow]
  model_invoked: [implement-ticket, finalize-effort, task-workflow-overview,
    task-workflow-doctor]

# ── Artifact model (schema 5) ──────────────────────────────────────────

artifact_model:
  types:
    - map
    - spec
    - architecture   # renames the legacy "arch spec"; arch-spec.md becomes
                     # architecture.md at the effort root
    - review         # review.md at the effort root, no workflow_state
    - task
    - ticket
    - findings
    - deviation report
    - changelog
    - index
    - out-of-scope note
  rename_rule: "type: arch spec becomes type: architecture and
    arch-spec.md becomes architecture.md, live and archived alike. An
    effort with exactly one architecture document has it hoisted to the
    effort root; an effort holding several has each renamed to
    architecture.md in place, so none is silently lost. The reader stays
    tolerant of the legacy filename and type as a safety net."
  map_frontmatter:
    # boolean, absent reads as false; set only by the reconcile checking
    # tool; auto-clears when a planning task is added, reopened, or moved
    # out of done, or when the map is edited
    - ready_for_spec
    # optional; links a follow-up effort to its origin; a field on the
    # child, never a graph edge
    - origin_effort
  map_body_sections:
    # absorbs the legacy ## Out of scope
    - "## Non-goals"
    # opens with a single bolded effort-level success test line, then the
    # facts
    - "## Non-negotiable facts"
  state: "docs/tasks/state.yaml carries schema_version: 5 plus the two
    real-null pointers (map, task); the migration stamps it."

# ── Graph kinds and subtypes ───────────────────────────────────────────

task_types:
  graph_kinds:
    - kind: "task"
      path: "docs/tasks/<effort>/tasks/<slug>/task.md"
      subtypes: [research, prototype, grilling, manual]
      label: "planning tasks"
    - kind: "ticket"
      path: "docs/tasks/<effort>/tickets/<slug>/ticket.md"
      subtypes: [feature, bug]
      label: "implementation tickets"
  blocked_by: "kind-scoped and effort-scoped: a planning task blocks only
    planning tasks, and an implementation ticket blocks only tickets. The
    frontier is computed per kind."
  vocabulary: "Canonical long forms are 'planning task' and 'implementation
    ticket'; the short forms are allowed only where the context already
    makes the kind unambiguous."
  note: "A task type and a standalone skill COEXIST for research/prototype
    (the task type is the planning artifact; the skill is the reusable
    discipline). Grilling/manual have no standalone skill; every grilling
    session delegates to the grilling skill."

# ── Conventions ────────────────────────────────────────────────────────

conventions:
  no_em_dashes: true
  invocation_split:
    mechanism: "frontmatter only (name, description, disable-model-invocation)"
    no_openai_yaml: true
    skill_tool_wording: "adapt 'Call the Skill tool with <name>' to Pi's
      invocation convention where operative; user-invoked skills phrased as
      human instructions."
  telemetry:
    maintained: true
    tools: ["submit_feedback"]
    note: "The opener absorbs telemetry_skill_context: it records the skill,
      effort, and target automatically, so the model no longer calls that
      tool. submit_feedback stays model-available for anomalies."

# ── Keep-as-ours (no Matt equivalent; concrete reason recorded) ────────

keep_as_ours:
  - item: "dependency graph + tw_* named transition tools"
    reason: "no Matt equivalent; we use docs/tasks/ files, not a tracker;
      the named tools are the only writers of docs/tasks/**"
    decision: "Q11.2"
  - item: "finalization pipeline"
    reason: "no Matt equivalent; our automation depth"
    decision: "Q11.3"
    v5_shape: "the per-ticket close-out runs inline in implement-ticket; the
      whole-effort review, finding triage, and the archive gate live in
      finalize-effort"
  - item: "failure toolbelt (diagnose, split, retry +50%, escalate) +
      parent-never-implements rule"
    reason: "no Matt equivalent; load-bearing automation safety"
    decision: "Q11.4"
  - item: "sub-agents (the 11 agent definitions)"
    reason: "no Matt equivalent; formalized with YAML frontmatter, tool
      allowlists, context isolation"
    decision: "Q11.5"
  - item: "telemetry instrumentation"
    reason: "map constraint; no Matt equivalent"
    decision: "Q11.6"
  - item: "Pi extension (src/pi.ts) + repo-gate (src/core/repo-gate.ts)"
    reason: "foundational; no Matt equivalent"
    decision: "map constraint"

# ── Changesets ─────────────────────────────────────────────────────────

changesets:
  adopted: true
  integrated_into: "scripts/release.sh"
  not_replacing: true
  config: ".changeset/config.json"
  description: "release.sh runs changeset versioning/generation then publishes;
    .changeset/ added with config.json + seed changeset."

# ── Deviations (recorded as truth) ─────────────────────────────────────

# Ids 1-6 are the schema-3 adoption hop's record (the run this file's v3
# edition distilled); upgrade-2-to-3.md still traces to them. Id 7 records
# the landed schema-5 hop.

deviations:
  - id: 1
    hop: "schema 2 to 3"
    description: "Eval harness (scripts/eval/) dropped with grilling-with-ui"
    reason: "not in the original design; surfaced as a real dependency during
      the adoption (with grilling-with-ui gone, it had no driver)"
  - id: 2
    hop: "schema 2 to 3"
    description: "validate_skill.mjs fix: allow disable-model-invocation +
      argument-hint frontmatter keys"
    reason: "the validator was too strict; every user-invoked skill uses
      disable-model-invocation"
  - id: 3
    hop: "schema 2 to 3"
    description: "CONTEXT.md scope = full workflow glossary (not domain-only)"
    reason: "this repo IS the workflow package, so its vocabulary is the
      domain"
  - id: 4
    hop: "schema 2 to 3"
    description: "Router entry point used grilling (grill-with-docs never
      became a separate skill)"
    reason: "the router referenced grilling + domain-modeling together"
  - id: 5
    hop: "schema 2 to 3"
    description: "Grilling re-aligned with plain text, not ask_user_question"
    reason: "consult-first user decision; kept completion gate +
      decision-recording"
  - id: 6
    hop: "schema 2 to 3"
    description: "No new agent definitions were needed"
    reason: "the adopted utility skills don't use subagents; the ones that
      do already had their agents defined"
  - id: 7
    hop: "schema 4 to 5"
    description: "The landed v5 output: MigrateReport.to is 5 (the report
      field's literal type changed from 4), the CLI no-op message reads
      'already on schema_version 5, nothing to do.', and the
      multi-architecture-doc corner renames each arch-spec.md to
      architecture.md in place rather than hoisting (the single-doc case
      still lands at the effort root)"
    reason: "hoisting all of an effort's architecture documents to one root
      filename would silently lose all but one; the in-place rename is the
      established no-loss rule. Recorded here because the upgrade resource
      (resources/upgrade-4-to-5.md) documents this landed behavior."
